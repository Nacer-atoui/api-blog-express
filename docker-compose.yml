services:
  blog-api:
    build: .
    container_name: blog-backend-api
    ports:
      - "3001:${PORT}"
    environment:
      - DB_HOST=blog-db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - blog-db

  blog-db:
    image: mysql:8.0
    container_name: blog-backend-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql